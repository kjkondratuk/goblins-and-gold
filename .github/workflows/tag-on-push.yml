name: Tag on Push to Main

on:
  push:
    branches:
      - main

jobs:
  tag:
    name: Create Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GIT_KEY }}

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      - name: Install svu
        run: go install github.com/caarlos0/svu@latest

      - name: Create Tag
        id: tag
        run: |
          OLD_TAG=$(svu current)
          NEW_TAG=$(svu next)
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git config --list
          git tag -a $NEW_TAG -m "Release $NEW_TAG"
          git push --tags
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "old_tag=$OLD_TAG" >> $GITHUB_OUTPUT
          echo "New Tag: $NEW_TAG" >> $GITHUB_STEP_SUMMARY
          echo "Old Tag: $OLD_TAG" >> $GITHUB_STEP_SUMMARY

      - name: Output Tag
        run: echo "Created and pushed tag ${{ steps.tag.outputs.tag }} (previous was ${{ steps.tag.outputs.old_tag }})"
